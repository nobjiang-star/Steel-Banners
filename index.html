<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>钢铁战旗</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  display: flex; justify-content: center; align-items: center;
  height: 100vh; overflow: hidden;
  font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
  user-select: none;
}
#game-container {
  display: flex; flex-direction: column;
  width: 100vw; height: 100vh;
  max-width: 1600px; max-height: 1000px;
}
#top-bar {
  height: 42px; background: linear-gradient(180deg, #16213e, #0f3460);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; color: #e0e0e0; font-size: 14px;
  border-bottom: 2px solid #533483; flex-shrink: 0; gap: 12px;
}
#top-bar .info-group { display: flex; gap: 6px; align-items: center; }
#top-bar .label { color: #888; font-size: 11px; }
#top-bar .value { color: #fff; font-weight: bold; font-size: 14px; }
#top-bar .status { font-size: 13px; font-weight: bold; padding: 3px 10px; border-radius: 4px; }
#top-bar .status.deploy { background: #2d6a4f; color: #95d5b2; }
#top-bar .status.countdown { background: #e07c24; color: #fff; }
#top-bar .status.battle { background: #c92a2a; color: #fff; }
#top-bar .status.win { background: #2d6a4f; color: #95d5b2; animation: pulse 1s infinite; }
#top-bar .status.lose { background: #6b2121; color: #faa; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
#canvas-wrap { flex: 1; position: relative; overflow: hidden; background: #1a1a2e; }
canvas { display: block; width: 100%; height: 100%; }
#bottom-bar {
  height: 58px; background: linear-gradient(180deg, #0f3460, #16213e);
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 0 10px; border-top: 2px solid #533483; flex-shrink: 0; flex-wrap: wrap;
}
#bottom-bar button {
  padding: 6px 10px; border: 2px solid #444; border-radius: 6px;
  background: #1a1a2e; color: #ccc; cursor: pointer; font-size: 12px;
  font-family: inherit; transition: all 0.15s; white-space: nowrap;
}
#bottom-bar button:hover { border-color: #888; color: #fff; }
#bottom-bar button.active { border-color: #4da6ff; background: #1a3a5c; color: #4da6ff; box-shadow: 0 0 8px rgba(77,166,255,0.4); }
#bottom-bar button:disabled { opacity: 0.4; cursor: not-allowed; border-color: #333; }
#bottom-bar button.limited { border-color: #c92a2a; color: #f88; }
#bottom-bar .btn-start { border-color: #2d6a4f; color: #95d5b2; font-weight: bold; font-size: 13px; }
#bottom-bar .btn-start:hover { background: #2d6a4f; color: #fff; }
#bottom-bar .btn-reset { border-color: #8b4513; color: #d4a574; }
#bottom-bar .btn-mission { border-color: #533483; color: #c9b8f0; font-size: 12px; }
#bottom-bar .btn-skill { border-color: #ffcc00; color: #ffcc00; font-weight: bold; }
#bottom-bar .btn-skill:hover:not(:disabled) { background: #4a3800; }
#bottom-bar .unit-count { font-size: 9px; color: #888; display: block; }

#stats-panel {
  position: absolute; top: 8px; right: 8px; width: 190px;
  background: rgba(0,0,0,0.85); border: 1px solid #444; border-radius: 8px;
  padding: 10px; color: #ccc; font-size: 11px; display: none; z-index: 10;
}
#stats-panel h3 { color: #fff; font-size: 13px; margin-bottom: 6px; border-bottom: 1px solid #444; padding-bottom: 4px; }
#stats-panel .stat-row { display: flex; justify-content: space-between; margin: 2px 0; }
#stats-panel .stat-row .kills { color: #f88; }
#stats-panel .stat-row .my-kills { color: #8f8; }
#result-overlay {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.75); display: none;
  justify-content: center; align-items: center; z-index: 20;
}
#result-overlay .result-box {
  text-align: center; padding: 40px 60px;
  background: #1a1a2e; border: 3px solid #533483; border-radius: 16px;
}
#result-overlay .result-title { font-size: 48px; font-weight: bold; margin-bottom: 16px; }
#result-overlay .result-title.win { color: #ffcc00; }
#result-overlay .result-title.lose { color: #c92a2a; }
#result-overlay .result-stats { color: #ccc; font-size: 14px; line-height: 1.8; }
#result-overlay button {
  margin: 4px; padding: 10px 24px; border: 2px solid #888; border-radius: 8px;
  background: #1a1a2e; color: #ccc; cursor: pointer; font-size: 14px;
  font-family: inherit; transition: all 0.15s;
}
#result-overlay button:hover { border-color: #fff; color: #fff; }
#skill-indicator {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  color: #ffcc00; font-size: 28px; font-weight: bold; pointer-events: none;
  display: none; z-index: 15; text-shadow: 0 0 20px rgba(255,204,0,0.8);
  animation: skillFade 1.5s forwards;
}
@keyframes skillFade {
  0% { opacity: 1; transform: translate(-50%,-50%) scale(0.5); }
  30% { opacity: 1; transform: translate(-50%,-50%) scale(1.2); }
  100% { opacity: 0; transform: translate(-50%,-50%) scale(1); }
}

/* Mission select overlay */
#mission-select {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.9); display: flex;
  justify-content: center; align-items: center; z-index: 30;
}
#mission-select .select-box {
  background: #16213e; border: 2px solid #533483; border-radius: 16px;
  padding: 30px; max-width: 750px; width: 95%;
}
#mission-select h2 {
  text-align: center; color: #ffcc00; font-size: 28px; margin-bottom: 8px;
}
#mission-select .subtitle { text-align: center; color: #888; font-size: 13px; margin-bottom: 20px; }
#mission-select .mission-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px;
}
#mission-select .mission-card {
  background: #1a1a2e; border: 2px solid #333; border-radius: 10px;
  padding: 14px; cursor: pointer; transition: all 0.2s; text-align: center;
}
#mission-select .mission-card:hover { border-color: #888; }
#mission-select .mission-card.selected { border-color: #ffcc00; background: #1a202e; box-shadow: 0 0 12px rgba(255,204,0,0.25); }
#mission-select .mission-card .m-icon { font-size: 28px; margin-bottom: 4px; }
#mission-select .mission-card .m-name { color: #fff; font-weight: bold; font-size: 14px; margin-bottom: 4px; }
#mission-select .mission-card .m-desc { color: #888; font-size: 11px; line-height: 1.4; }
#mission-select .m-info { color: #aaa; font-size: 11px; margin-bottom: 4px; }
#mission-select .diff-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 16px; }
#mission-select .diff-row span { color: #888; font-size: 13px; }
#mission-select .diff-btn {
  padding: 6px 16px; border: 2px solid #444; border-radius: 6px;
  background: #1a1a2e; color: #ccc; cursor: pointer; font-size: 13px;
  font-family: inherit; transition: all 0.15s;
}
#mission-select .diff-btn:hover { border-color: #888; }
#mission-select .diff-btn.selected { border-color: #ffcc00; color: #ffcc00; }
#mission-select .btn-go {
  display: block; margin: 0 auto; padding: 12px 48px;
  border: 2px solid #2d6a4f; border-radius: 10px;
  background: #1a3a2a; color: #95d5b2; cursor: pointer;
  font-size: 18px; font-weight: bold; font-family: inherit; transition: all 0.2s;
}
#mission-select .btn-go:hover { background: #2d6a4f; color: #fff; }
</style>
</head>

    </div>
  </div>

const MAX_PROJECTILES = 1200;
const SEPARATION_RADIUS = 22;
const SEPARATION_FORCE = 0.35;
const SEPARATION_UPDATE_INTERVAL = 3;

// ============================================================
// SPATIAL GRID
// ============================================================
class SpatialGrid {
  constructor(width, height, cellSize) {
    this.cellSize = cellSize;
    this.cols = Math.ceil(width / cellSize);
    this.rows = Math.ceil(height / cellSize);
    this.cells = new Array(this.cols * this.rows);
    this.clear();
  }
  clear() { for (let i = 0; i < this.cells.length; i++) this.cells[i] = []; }
  getIndex(x, y) {
    const cx = Math.floor(x / this.cellSize);
    const cy = Math.floor(y / this.cellSize);
    if (cx < 0 || cy < 0 || cx >= this.cols || cy >= this.rows) return -1;
    return cy * this.cols + cx;
  }
  insert(unit) {
    const idx = this.getIndex(unit.x, unit.y);
    if (idx >= 0) this.cells[idx].push(unit);
  }
  getNearby(x, y, range) {
    const result = [];
    const minCX = Math.max(0, Math.floor((x - range) / this.cellSize));
    const maxCX = Math.min(this.cols - 1, Math.floor((x + range) / this.cellSize));
    const minCY = Math.max(0, Math.floor((y - range) / this.cellSize));
    const maxCY = Math.min(this.rows - 1, Math.floor((y + range) / this.cellSize));
    for (let cy = minCY; cy <= maxCY; cy++) {
      for (let cx = minCX; cx <= maxCX; cx++) {
        const cell = this.cells[cy * this.cols + cx];
        for (let i = 0; i < cell.length; i++) result.push(cell[i]);
      }
    }
    return result;
  }
}

// ============================================================
// PROJECTILE CLASS
// ============================================================
class Projectile {
  constructor(x, y, target, damage, team, isTracer = false) {
    this.x = x; this.y = y;
    this.target = target; this.damage = damage; this.team = team;
    this.isHeavy = damage >= 120;
    this.speed = this.isHeavy ? 3.5 : (isTracer ? 8 : 5);
    this.alive = true;
    this.radius = this.isHeavy ? 5 : (isTracer ? 1.5 : 2);
    this.vx = 0; this.vy = 0;
    this.isTracer = isTracer;
  }
  update() {
    if (!this.target || !this.target.alive) { this.alive = false; return; }
    const dx = this.target.x - this.x;
    const dy = this.target.y - this.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < this.speed + this.target.radius) {
      this.target.takeDamage(this.damage);
      this.alive = false;
      return;
    }
    this.vx = (dx / dist) * this.speed;
    this.vy = (dy / dist) * this.speed;
    this.x += this.vx;
    this.y += this.vy;
  }
  draw(ctx) {
    if (this.isHeavy) {
      ctx.fillStyle = 'rgba(80,80,80,0.4)';
      ctx.beginPath(); ctx.arc(this.x, this.y, this.radius + 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#333';
      ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#555';
      ctx.beginPath(); ctx.arc(this.x - 1, this.y - 1, this.radius * 0.6, 0, Math.PI * 2); ctx.fill();
    } else if (this.isTracer) {
      ctx.strokeStyle = this.team === 0 ? '#ffdd44' : '#ff8844';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(this.x - this.vx * 1.5, this.y - this.vy * 1.5); ctx.stroke();
      ctx.fillStyle = this.team === 0 ? '#ffdd44' : '#ff8844';
      ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = this.team === 0 ? '#88ccff' : '#ff8866';
      ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill();
    }
  }
}

// ============================================================
// UNIT CLASS
// ============================================================
class Unit {
  constructor(type, x, y, team, isGeneral = false, statMul = 1.0) {
    const cfg = UNIT_CONFIG[type];
    this.type = type;
    this.category = cfg.category;
    this.x = x; this.y = y;
    this.team = team;
    this.isGeneral = isGeneral;
    this.alive = true;

    this.maxHp = Math.round(cfg.hp * statMul);
    this.hp = this.maxHp;
    this.baseAttack = Math.round(cfg.attack * statMul);
    this.baseRange = cfg.range;
    this.baseSpeed = cfg.speed;
    this.baseAttackCooldown = cfg.attackCooldown;
    this.radius = cfg.radius;
    this.shape = cfg.shape;
    this.bonusVs = cfg.bonusVs || null;
    this.bonusMultiplier = cfg.bonusMultiplier || 1;
    this.isRanged = cfg.projectile === true;

    if (team === 0) {
      this.color = cfg.color;
      this.colorDark = cfg.colorDark;
    } else {
      const ec = ENEMY_COLORS[type];
      this.color = ec.color;
      this.colorDark = ec.colorDark;
    }

    this.attackCooldownTimer = 0;
    this.target = null;
    this.targetUpdateCounter = Math.floor(Math.random() * TARGET_UPDATE_INTERVAL);
    this.separationCounter = Math.floor(Math.random() * SEPARATION_UPDATE_INTERVAL);
    this.vx = 0; this.vy = 0;
    this.flashTimer = 0;
    this.skillGlowTimer = 0;
    this.terrainRangeBonus = null;
    this.terrainSpeedMul = null;
    this.terrainDefenseBonus = false;
  }

  getAttack() {
    let atk = this.baseAttack;
    if (this.moraleAttackBoost) atk *= this.moraleAttackBoost;
    if (this.skillAttackBoost) atk *= this.skillAttackBoost;
    return atk;
  }

  getSpeed() {
    let spd = this.baseSpeed;
    if (this.moraleSpeedPenalty) spd *= this.moraleSpeedPenalty;
    if (this.skillSpeedBoost) spd *= this.skillSpeedBoost;
    if (this.terrainSpeedMul) spd *= this.terrainSpeedMul;
    return spd;
  }

  getAttackCooldown() {
    let cd = this.baseAttackCooldown;
    if (this.moraleCooldownPenalty) cd *= this.moraleCooldownPenalty;
    return cd;
  }

  getRange() {
    let r = this.baseRange;
    if (this.terrainRangeBonus) r *= this.terrainRangeBonus;
    return r;
  }

  takeDamage(amount) {
    if (this.terrainDefenseBonus) amount *= 0.8;
    this.hp -= amount;
    this.flashTimer = 6;
    if (this.hp <= 0) { this.hp = 0; this.alive = false; }
  }

  distanceTo(other) {
    const dx = this.x - other.x;
    const dy = this.y - other.y;
    return Math.sqrt(dx * dx + dy * dy);
  }

  findTarget(game) {
    const SEARCH_RADIUS = 400;
    let bestDist = SEARCH_RADIUS;
    let bestTarget = null;
    const enemies = game.spatialGrid.getNearby(this.x, this.y, SEARCH_RADIUS);
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (e.team === this.team || !e.alive) continue;
      let priorityDist = this.distanceTo(e);
      if (this.bonusVs === e.category) priorityDist *= 0.4;
      if (priorityDist < bestDist) { bestDist = priorityDist; bestTarget = e; }
    }
    this.target = bestTarget;
  }

  update(dt, game) {
    if (!this.alive) return;
    if (this.flashTimer > 0) this.flashTimer--;
    if (this.skillGlowTimer > 0) this.skillGlowTimer--;

    this.updateMorale(game);
    this.updateTerrain(game);

    if (this.attackCooldownTimer > 0) this.attackCooldownTimer -= dt;

    this.targetUpdateCounter--;
    if (this.targetUpdateCounter <= 0) {
      this.targetUpdateCounter = TARGET_UPDATE_INTERVAL;
      this.findTarget(game);
    }
    if (this.target && !this.target.alive) this.target = null;

    if (this.target) {
      const dist = this.distanceTo(this.target);
      if (dist <= this.getRange()) {
        if (this.attackCooldownTimer <= 0) this.attackTarget(game);
        this.vx = 0; this.vy = 0;
      } else {
        const dx = this.target.x - this.x;
        const dy = this.target.y - this.y;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d > 0) {
          const spd = this.getSpeed();
          this.vx = (dx / d) * spd;
          this.vy = (dy / d) * spd;
        }
      }
    } else {
      const dir = this.team === 0 ? 1 : -1;
      this.vx = dir * this.getSpeed() * 0.8;
      this.vy = (Math.random() - 0.5) * this.getSpeed() * 0.4;
    }

    this.separationCounter--;
    if (this.separationCounter <= 0) {
      this.separationCounter = SEPARATION_UPDATE_INTERVAL;
      this.applySeparation(game);
    }

    this.x += this.vx * dt * 0.06;
    this.y += this.vy * dt * 0.06;

    const margin = this.radius + 2;
    if (this.x < margin) this.x = margin;
    if (this.y < margin) this.y = margin;
    if (this.x > game.canvasWidth - margin) this.x = game.canvasWidth - margin;
    if (this.y > game.canvasHeight - margin) this.y = game.canvasHeight - margin;
  }

  applySeparation(game) {
    const nearby = game.spatialGrid.getNearby(this.x, this.y, SEPARATION_RADIUS);
    let sepX = 0, sepY = 0, count = 0;
    for (let i = 0; i < nearby.length; i++) {
      const u = nearby[i];
      if (u === this || !u.alive || u.team !== this.team) continue;
      const dx = this.x - u.x, dy = this.y - u.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const minDist = this.radius + u.radius + 2;
      if (dist < minDist && dist > 0.01) {
        sepX += (dx / dist) * (minDist - dist);
        sepY += (dy / dist) * (minDist - dist);
        count++;
      }
    }
    if (count > 0) {
      this.vx += (sepX / count) * SEPARATION_FORCE;
      this.vy += (sepY / count) * SEPARATION_FORCE;
    }
  }

  updateMorale(game) {
    this.moraleAttackBoost = null;
    this.moraleSpeedPenalty = null;
    this.moraleCooldownPenalty = null;
    const general = this.team === 0 ? game.playerGeneral : game.enemyGeneral;
    if (general) {
      if (this !== general) {
        const distToGeneral = this.distanceTo(general);
        if (distToGeneral <= MORALE_CONFIG.generalAuraRadius) {
          this.moraleAttackBoost = MORALE_CONFIG.attackBoostNearGeneral;
        }
      }
    } else {
      this.moraleSpeedPenalty = MORALE_CONFIG.speedPenaltyGeneralDead;
      this.moraleCooldownPenalty = MORALE_CONFIG.cooldownPenaltyGeneralDead;
    }
  }

  updateTerrain(game) {
    this.terrainRangeBonus = null;
    this.terrainSpeedMul = null;
    this.terrainDefenseBonus = false;
    for (const zone of game.terrainZones) {
      if (this.x >= zone.x1 && this.x <= zone.x2 && this.y >= zone.y1 && this.y <= zone.y2) {
        if (zone.speedMul !== undefined && zone.speedMul !== 1.0) this.terrainSpeedMul = zone.speedMul;
        if (zone.rangeBonus) this.terrainRangeBonus = zone.rangeBonus;
        if (zone.defenseBonus) this.terrainDefenseBonus = true;
        break;
      }
    }
  }

  attackTarget(game) {
    const target = this.target;
    if (!target || !target.alive) return;
    const cfg = UNIT_CONFIG[this.type];

    if (cfg.bayonetRange !== undefined) {
      const dist = this.distanceTo(target);
      if (dist <= cfg.bayonetRange) {
        let dmg = cfg.bayonetAttack;
        if (this.bonusVs && target.category === this.bonusVs) dmg *= this.bonusMultiplier;
        target.takeDamage(dmg);
        this.attackCooldownTimer = cfg.bayonetCooldown;
        return;
      }
    }

    let dmg = this.getAttack();
    if (this.bonusVs && target.category === this.bonusVs) dmg *= this.bonusMultiplier;

    if (this.isRanged) {
      const isTracer = this.category === 'maxim' || this.category === 'artillery';
      game.addProjectile(this.x, this.y, target, dmg, this.team, isTracer);
      if (cfg.splashRadius && cfg.splashTargets) {
        const nearby = game.spatialGrid.getNearby(target.x, target.y, cfg.splashRadius);
        let splashed = 0;
        for (let i = 0; i < nearby.length && splashed < cfg.splashTargets; i++) {
          const e = nearby[i];
          if (e === target || e.team === this.team || !e.alive) continue;
          const dist = Math.sqrt((e.x - target.x) ** 2 + (e.y - target.y) ** 2);
          if (dist <= cfg.splashRadius) {
            let splashDmg = this.getAttack();
            if (this.bonusVs && e.category === this.bonusVs) splashDmg *= this.bonusMultiplier;
            e.takeDamage(splashDmg);
            splashed++;
          }
        }
      }
    } else {
      target.takeDamage(dmg);
    }
    this.attackCooldownTimer = this.getAttackCooldown();
  }

  draw(ctx) {
    if (!this.alive) return;
    ctx.save();
    ctx.translate(this.x, this.y);

    if (this.skillGlowTimer > 0) {
      ctx.beginPath(); ctx.arc(0, 0, this.radius + 6, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,204,0,${this.skillGlowTimer / 30})`;
      ctx.lineWidth = 2; ctx.stroke();
    }

    const baseColor = this.flashTimer > 0 ? '#ffffff' : this.color;

    if (this.isGeneral) {
      ctx.beginPath(); ctx.arc(0, 0, this.radius + 3, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,200,0,0.6)'; ctx.fill();
      ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = 2; ctx.stroke();
    }

    // Defense bonus shield indicator
    if (this.terrainDefenseBonus) {
      ctx.beginPath(); ctx.arc(0, 0, this.radius + 5, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(100,200,255,0.5)'; ctx.lineWidth = 2; ctx.stroke();
    }

    ctx.fillStyle = baseColor;
    ctx.strokeStyle = this.colorDark;
    ctx.lineWidth = 1;
    ctx.beginPath();

    switch (this.shape) {
      case 'square':
        ctx.rect(-this.radius, -this.radius, this.radius * 2, this.radius * 2); break;
      case 'triangle':
        ctx.moveTo(0, -this.radius); ctx.lineTo(-this.radius, this.radius);
        ctx.lineTo(this.radius, this.radius); ctx.closePath(); break;
      case 'diamond':
        ctx.moveTo(0, -this.radius); ctx.lineTo(this.radius, 0);
        ctx.lineTo(0, this.radius); ctx.lineTo(-this.radius, 0); ctx.closePath(); break;
      case 'star':
        this.drawStar(ctx, 0, 0, this.radius, this.radius * 0.45, 5); break;
      case 'maxim': this.drawMaxim(ctx); break;
      case 'musketeer': this.drawMusketeer(ctx); break;
      case 'artillery': this.drawArtillery(ctx); break;
      case 'circle':
      default: ctx.arc(0, 0, this.radius, 0, Math.PI * 2); break;
    }
    ctx.fill(); ctx.stroke();

    if (this.hp < this.maxHp) {
      const barW = this.radius * 2.2, barH = 3, barY = -this.radius - 8;
      const hpRatio = this.hp / this.maxHp;
      ctx.fillStyle = '#400000'; ctx.fillRect(-barW / 2, barY, barW, barH);
      ctx.fillStyle = hpRatio > 0.5 ? '#44cc44' : hpRatio > 0.25 ? '#cccc44' : '#cc4444';
      ctx.fillRect(-barW / 2, barY, barW * hpRatio, barH);
    }

    if (this.isGeneral) {
      ctx.fillStyle = '#fff'; ctx.font = `${this.radius}px sans-serif`;
      ctx.textAlign = 'center'; ctx.fillText('★', 0, this.radius * 0.35);
    }
    ctx.restore();
  }

  drawStar(ctx, cx, cy, outerR, innerR, points) {
    const step = Math.PI / points;
    for (let i = 0; i < points * 2; i++) {
      const r = i % 2 === 0 ? outerR : innerR;
      const angle = i * step - Math.PI / 2;
      const x = cx + Math.cos(angle) * r, y = cy + Math.sin(angle) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  drawMaxim(ctx) {
    const r = this.radius;
    ctx.fillStyle = '#3a4045'; ctx.fillRect(-r * 0.9, -r * 0.35, r * 1.8, r * 0.7);
    ctx.strokeStyle = '#222'; ctx.lineWidth = 1; ctx.strokeRect(-r * 0.9, -r * 0.35, r * 1.8, r * 0.7);
    ctx.fillStyle = '#2a2a2a'; ctx.fillRect(-r * 1.3, -r * 0.15, r * 0.5, r * 0.3);
    ctx.strokeStyle = '#555'; ctx.lineWidth = 0.5;
    for (let i = 0; i < 3; i++) {
      const sx = -r * 0.5 + i * r * 0.5;
      ctx.beginPath(); ctx.moveTo(sx, -r * 0.35); ctx.lineTo(sx, r * 0.35); ctx.stroke();
    }
    ctx.strokeStyle = '#3a3025'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-r * 0.3, r * 0.35); ctx.lineTo(-r * 0.5, r * 0.85);
    ctx.moveTo(r * 0.3, r * 0.35); ctx.lineTo(r * 0.5, r * 0.85);
    ctx.moveTo(0, r * 0.35); ctx.lineTo(0, r * 0.9); ctx.stroke();
    ctx.fillStyle = this.colorDark;
    ctx.beginPath(); ctx.arc(-r * 0.4, -r * 0.9, r * 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(r * 0.5, -r * 0.8, r * 0.3, 0, Math.PI * 2); ctx.fill();
    if (this.flashTimer > 0) {
      ctx.fillStyle = '#ffcc00';
      ctx.beginPath(); ctx.arc(-r * 1.3, 0, r * 0.4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(-r * 1.3, 0, r * 0.2, 0, Math.PI * 2); ctx.fill();
    }
  }

  drawMusketeer(ctx) {
    const r = this.radius;
    ctx.fillStyle = this.colorDark; ctx.fillRect(-r * 0.5, -r * 0.6, r, r * 1.2);
    ctx.strokeStyle = '#111'; ctx.lineWidth = 1; ctx.strokeRect(-r * 0.5, -r * 0.6, r, r * 1.2);
    ctx.fillStyle = '#1a1a1a'; ctx.fillRect(-r * 0.7, -r * 1.1, r * 1.4, r * 0.5);
    ctx.strokeStyle = '#4a3a2a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(r * 0.5, -r * 0.2); ctx.lineTo(r * 2.0, -r * 0.8); ctx.stroke();
    ctx.fillStyle = '#ccc';
    ctx.beginPath(); ctx.moveTo(r * 2.0, -r * 0.8); ctx.lineTo(r * 2.3, -r * 0.95); ctx.lineTo(r * 1.9, -r * 1.05); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#6b4a2a'; ctx.fillRect(-r * 1.0, -r * 0.3, r * 0.6, r * 0.2);
    if (this.flashTimer > 2) {
      ctx.fillStyle = '#ffdd66';
      ctx.beginPath(); ctx.arc(r * 2.0, -r * 0.8, r * 0.5, 0, Math.PI * 2); ctx.fill();
    }
  }

  drawArtillery(ctx) {
    const r = this.radius;
    ctx.strokeStyle = '#3a3020'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(-r * 0.6, r * 0.6, r * 0.45, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(r * 0.6, r * 0.6, r * 0.45, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 1;
    for (let w = -1; w <= 1; w += 2) {
      for (let a = 0; a < 4; a++) {
        const angle = a * Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(w * r * 0.6 + Math.cos(angle) * r * 0.15, r * 0.6 + Math.sin(angle) * r * 0.15);
        ctx.lineTo(w * r * 0.6 + Math.cos(angle) * r * 0.4, r * 0.6 + Math.sin(angle) * r * 0.4); ctx.stroke();
      }
    }
    ctx.strokeStyle = '#333'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-r * 0.3, -r * 0.1); ctx.lineTo(-r * 1.5, -r * 0.5); ctx.stroke();
    ctx.fillStyle = '#444'; ctx.fillRect(-r * 1.3, -r * 0.7, r * 0.7, r * 0.6);
    ctx.fillStyle = '#4a4a3a'; ctx.fillRect(-r * 0.7, -r * 0.3, r * 1.4, r * 0.8);
    ctx.strokeStyle = '#222'; ctx.lineWidth = 1; ctx.strokeRect(-r * 0.7, -r * 0.3, r * 1.4, r * 0.8);
    ctx.fillStyle = this.colorDark;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.arc(-r * 0.5 + i * r * 0.5, -r * 0.9, r * 0.25, 0, Math.PI * 2); ctx.fill();
    }
    if (this.flashTimer > 2) {
      ctx.fillStyle = '#ff8800';
      ctx.beginPath(); ctx.arc(-r * 1.8, -r * 0.5, r * 0.7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffdd44';
      ctx.beginPath(); ctx.arc(-r * 1.8, -r * 0.5, r * 0.35, 0, Math.PI * 2); ctx.fill();
    }
  }
}

// ============================================================
// GAME CLASS
// ============================================================
class Game {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.selectedMissionIdx = 0;
    this.selectedDifficulty = 0;
    this.playerDeployedByType = {};
    this.resize();
    this.state = 'select';
    this.playerUnits = [];
    this.enemyUnits = [];
    this.projectiles = [];
    this.selectedType = 'shield';
    this.playerKills = 0;
    this.enemyKills = 0;
    this.initialPlayerCounts = {};
    this.initialEnemyCounts = {};
    this.countdownRemaining = 0;
    this.skillCooldownRemaining = 0;
    this.skillActive = false;
    this.skillTimer = 0;
    this.isDragging = false;
    this.dragStartX = 0; this.dragStartY = 0; this.dragEndX = 0; this.dragEndY = 0;
    this.mouseX = 0; this.mouseY = 0; this.mouseOnCanvas = false;
    this.frameCount = 0;
    this.playerGeneral = null;
    this.enemyGeneral = null;
    this.spatialGrid = null;
    this.terrainZones = [];
    this.lastTime = performance.now();

    this.setupMissionSelectUI();
    this.setupEvents();
    this.loop();
  }

  resize() {
    const wrap = this.canvas.parentElement;
    this.canvasWidth = wrap.clientWidth;
    this.canvasHeight = wrap.clientHeight;
    this.canvas.width = this.canvasWidth;
    this.canvas.height = this.canvasHeight;
    this.midline = this.canvasWidth / 2;
    this.spatialGrid = new SpatialGrid(this.canvasWidth, this.canvasHeight, SPATIAL_CELL_SIZE);
    if (this.playerUnits && this.enemyUnits) this.rebuildSpatialGrid();
    this.recalcTerrainZones();
  }

  rebuildSpatialGrid() {
    this.spatialGrid = new SpatialGrid(this.canvasWidth, this.canvasHeight, SPATIAL_CELL_SIZE);
    this.spatialGrid.clear();
    for (const u of this.playerUnits) if (u.alive) this.spatialGrid.insert(u);
    for (const u of this.enemyUnits) if (u.alive) this.spatialGrid.insert(u);
  }

  recalcTerrainZones() {
    const mission = MISSIONS[this.selectedMissionIdx];
    this.terrainZones = [];
    for (const tz of mission.terrainZones) {
      this.terrainZones.push({
        x1: tz.x1 * this.canvasWidth,
        y1: tz.y1 * this.canvasHeight,
        x2: tz.x2 * this.canvasWidth,
        y2: tz.y2 * this.canvasHeight,
        type: tz.type,
        speedMul: tz.speedMul,
        rangeBonus: tz.rangeBonus,
        defenseBonus: tz.defenseBonus || false
      });
    }
  }

  init() {
    this.playerUnits = [];
    this.enemyUnits = [];
    this.projectiles = [];
    this.playerKills = 0;
    this.enemyKills = 0;
    this.state = 'deploy';
    this.skillCooldownRemaining = 0;
    this.skillActive = false;
    this.skillTimer = 0;
    this.playerGeneral = null;
    this.enemyGeneral = null;
    this.playerDeployedByType = {};
    for (const key of Object.keys(UNIT_CONFIG)) {
      this.playerDeployedByType[key] = 0;
    }

    const genX = this.midline * 0.35;
    const genY = this.canvasHeight / 2;
    this.playerUnits.push(new Unit('general', genX, genY, 0, true));

    this.createEnemyArmy();
    this.recalcTerrainZones();

    this.initialPlayerCounts = this.countByType(this.playerUnits);
    this.initialEnemyCounts = this.countByType(this.enemyUnits);

    this.spatialGrid = new SpatialGrid(this.canvasWidth, this.canvasHeight, SPATIAL_CELL_SIZE);
    document.getElementById('stats-panel').style.display = 'none';
    document.getElementById('result-overlay').style.display = 'none';
    document.getElementById('mission-select').style.display = 'none';
    this.updateUI();
  }

  countByType(units) {
    const counts = {};
    for (const u of units) { if (!u.alive) continue; counts[u.category] = (counts[u.category] || 0) + 1; }
    return counts;
  }

  countAlive(units) { let c = 0; for (const u of units) if (u.alive) c++; return c; }

  countAliveByType(units) {
    const counts = {};
    for (const key of Object.keys(UNIT_CONFIG)) counts[key] = 0;
    for (const u of units) { if (u.alive) counts[u.category] = (counts[u.category] || 0) + 1; }
    return counts;
  }

  createEnemyArmy() {
    const mission = MISSIONS[this.selectedMissionIdx];
    const diff = DIFFICULTY_LEVELS[this.selectedDifficulty];
    const w = this.canvasWidth, h = this.canvasHeight;

    for (const group of mission.enemyGroups) {
      if (group.type === 'general') {
        const gx = group.x1 * w + (group.x2 - group.x1) * w * 0.5;
        const gy = group.y1 * h + (group.y2 - group.y1) * h * 0.5;
        this.enemyUnits.push(new Unit('general', gx, gy, 1, true, diff.enemyStatMul));
      } else {
        const count = Math.round(group.count * diff.enemyCountMul);
        this.deployFormation(group.type, count,
          group.x1 * w, group.y1 * h, group.x2 * w, group.y2 * h, 1, false, diff.enemyStatMul);
      }
    }
  }

  deployFormation(type, count, x1, y1, x2, y2, team, compact = false, statMul = 1.0) {
    const cfg = UNIT_CONFIG[type];
    const spacing = cfg.radius * (compact ? 2.0 : 2.8);
    const availWidth = x2 - x1, availHeight = y2 - y1;
    const cols = Math.max(1, Math.floor(availHeight / spacing));
    const rows = Math.ceil(count / cols);

    for (let i = 0; i < count; i++) {
      const row = Math.floor(i / cols), col = i % cols;
      const rowCount = Math.min(cols, count - row * cols);
      const jx = compact ? 0.15 : 0.35;
      const x = x1 + (row / Math.max(1, rows - 1)) * availWidth + (Math.random() - 0.5) * spacing * jx;
      const y = y1 + (col / Math.max(1, rowCount - 1)) * availHeight + (Math.random() - 0.5) * spacing * jx;
      this.enemyUnits.push(new Unit(type,
        Math.max(x1, Math.min(x2, x)), Math.max(y1, Math.min(y2, y)), team, false, statMul));
    }
  }

  getMaxForType(type) { return UNIT_CONFIG[type].maxCount || 999; }
  getDeployedForType(type) { return this.playerDeployedByType[type] || 0; }

  deployPlayerUnit(x, y) {
    if (this.state !== 'deploy') return false;
    if (x > this.midline - 10) return false;
    if (this.selectedType === 'general') return false;
    const max = this.getMaxForType(this.selectedType);
    const current = this.getDeployedForType(this.selectedType);
    if (current >= max) return false;

    this.playerUnits.push(new Unit(this.selectedType, x, y, 0, false));
    this.playerDeployedByType[this.selectedType] = (this.playerDeployedByType[this.selectedType] || 0) + 1;
    this.updateUI();
    return true;
  }

  deployLine(x1, y1, x2, y2) {
    if (this.state !== 'deploy') return 0;
    if (this.selectedType === 'general') return 0;

    const cfg = UNIT_CONFIG[this.selectedType];
    const spacing = cfg.radius * 2.8;
    const dx = x2 - x1, dy = y2 - y1;
    const lineLen = Math.sqrt(dx * dx + dy * dy);
    if (lineLen < 1) return this.deployPlayerUnit(x1, y1) ? 1 : 0;

    const maxFit = Math.floor(lineLen / spacing) + 1;
    const remaining = this.getMaxForType(this.selectedType) - this.getDeployedForType(this.selectedType);
    const count = Math.min(maxFit, remaining);
    if (count <= 0) return 0;

    for (let i = 0; i < count; i++) {
      const t = count === 1 ? 0.5 : i / (count - 1);
      const px = x1 + dx * t, py = y1 + dy * t;
      if (px < this.midline - 10 && px > 5 && py > 5 && py < this.canvasHeight - 5) {
        this.playerUnits.push(new Unit(this.selectedType, px, py, 0, false));
        this.playerDeployedByType[this.selectedType] = (this.playerDeployedByType[this.selectedType] || 0) + 1;
      }
    }
    this.updateUI();
    return count;
  }

  startBattle() {
    if (this.state !== 'deploy') return;
    this.state = 'countdown';
    this.countdownRemaining = COUNTDOWN_SECONDS;
    document.getElementById('stats-panel').style.display = 'block';
    this.updateUI();
  }

  reset() {
    this.init();
    this.updateUI();
    document.getElementById('stats-panel').style.display = 'none';
    document.getElementById('result-overlay').style.display = 'none';
  }

  showMissionSelect() {
    this.state = 'select';
    this.playerUnits = [];
    this.enemyUnits = [];
    this.projectiles = [];
    document.getElementById('mission-select').style.display = 'flex';
    document.getElementById('result-overlay').style.display = 'none';
    document.getElementById('stats-panel').style.display = 'none';
    this.updateUI();
  }

  activateSkill() {
    if (this.state !== 'battle') return;
    if (this.skillCooldownRemaining > 0 || this.skillActive) return;
    if (!this.isPlayerGeneralAlive()) return;

    this.skillActive = true;
    this.skillTimer = SKILL_CONFIG.duration;
    this.skillCooldownRemaining = SKILL_CONFIG.cooldown;

    for (const u of this.playerUnits) {
      if (!u.alive) continue;
      u.skillAttackBoost = SKILL_CONFIG.attackBoost;
      u.skillSpeedBoost = SKILL_CONFIG.speedBoost;
      u.skillGlowTimer = 30;
    }

    const indicator = document.getElementById('skill-indicator');
    indicator.style.display = 'block';
    indicator.style.animation = 'none';
    indicator.offsetHeight;
    indicator.style.animation = 'skillFade 1.5s forwards';

    this.updateUI();
  }

  isPlayerGeneralAlive() {
    for (const u of this.playerUnits) { if (u.isGeneral && u.alive) return true; }
    return false;
  }

  isEnemyGeneralAlive() {
    for (const u of this.enemyUnits) { if (u.isGeneral && u.alive) return true; }
    return false;
  }

  addProjectile(x, y, target, damage, team, isTracer = false) {
    if (this.projectiles.length >= MAX_PROJECTILES) return;
    this.projectiles.push(new Projectile(x, y, target, damage, team, isTracer));
  }

  update(dt) {
    if (this.state === 'win' || this.state === 'lose' || this.state === 'select') return;

    const cappedDt = Math.min(dt, 33);

    if (this.state === 'countdown') {
      this.countdownRemaining -= cappedDt / 1000;
      if (this.countdownRemaining <= 0) {
        this.countdownRemaining = 0;
        this.state = 'battle';
        this.updateUI();
      }
    }

    if (this.skillActive) {
      this.skillTimer -= cappedDt;
      if (this.skillTimer <= 0) {
        this.skillActive = false; this.skillTimer = 0;
        for (const u of this.playerUnits) { u.skillAttackBoost = null; u.skillSpeedBoost = null; }
      }
    }
    if (this.skillCooldownRemaining > 0 && !this.skillActive) {
      this.skillCooldownRemaining -= cappedDt;
      if (this.skillCooldownRemaining < 0) this.skillCooldownRemaining = 0;
    }

    this.spatialGrid.clear();
    for (const u of this.playerUnits) if (u.alive) this.spatialGrid.insert(u);
    for (const u of this.enemyUnits) if (u.alive) this.spatialGrid.insert(u);

    this.playerGeneral = null;
    this.enemyGeneral = null;
    for (const u of this.playerUnits) { if (u.isGeneral && u.alive) { this.playerGeneral = u; break; } }
    for (const u of this.enemyUnits) { if (u.isGeneral && u.alive) { this.enemyGeneral = u; break; } }

    if (this.state === 'battle') {
      for (const u of this.playerUnits) { if (u.alive) u.update(cappedDt, this); }
      for (const u of this.enemyUnits) { if (u.alive) u.update(cappedDt, this); }
    }

    this.trackKills();

    for (let i = this.projectiles.length - 1; i >= 0; i--) {
      this.projectiles[i].update();
      if (!this.projectiles[i].alive) this.projectiles.splice(i, 1);
    }

    if (this.state === 'battle') this.checkWinLose();

    this.frameCount++;
    if (this.frameCount % 30 === 0) this.updateUI();
  }

  trackKills() {
    const initialPTotal = Object.values(this.initialPlayerCounts).reduce((a, b) => a + b, 0);
    this.enemyKills = initialPTotal - this.countAlive(this.playerUnits);
    const initialETotal = Object.values(this.initialEnemyCounts).reduce((a, b) => a + b, 0);
    this.playerKills = initialETotal - this.countAlive(this.enemyUnits);
  }

  checkWinLose() {
    const pAlive = this.countAlive(this.playerUnits);
    const eAlive = this.countAlive(this.enemyUnits);
    if (eAlive === 0) { this.state = 'win'; this.showResult(true); }
    else if (pAlive === 0) { this.state = 'lose'; this.showResult(false); }
  }

  showResult(won) {
    const overlay = document.getElementById('result-overlay');
    const title = document.getElementById('result-title');
    const stats = document.getElementById('result-stats');
    overlay.style.display = 'flex';
    title.textContent = won ? '🎉 胜利！' : '💀 失败！';
    title.className = 'result-title ' + (won ? 'win' : 'lose');

    const pCounts = this.countAliveByType(this.playerUnits);
    const eCounts = this.countAliveByType(this.enemyUnits);
    const mission = MISSIONS[this.selectedMissionIdx];
    const diff = DIFFICULTY_LEVELS[this.selectedDifficulty];

    stats.innerHTML = `
      关卡: <b>${mission.name}</b> | 难度: <b>${diff.emoji} ${diff.name}</b><br>
      我方击杀: <b>${this.playerKills}</b> &nbsp; 敌方击杀: <b>${this.enemyKills}</b><br>
      <br>我方剩余:<br>
      盾兵: ${pCounts.shield}/${UNIT_CONFIG.shield.maxCount} | 长矛兵: ${pCounts.spear}/${UNIT_CONFIG.spear.maxCount}<br>
      骑兵: ${pCounts.cavalry}/${UNIT_CONFIG.cavalry.maxCount} | 射手: ${pCounts.archer}/${UNIT_CONFIG.archer.maxCount}<br>
      马克沁: ${pCounts.maxim || 0}/${UNIT_CONFIG.maxim.maxCount} | 火枪手: ${pCounts.musketeer || 0}/${UNIT_CONFIG.musketeer.maxCount}<br>
      炮兵: ${pCounts.artillery || 0}/${UNIT_CONFIG.artillery.maxCount} | 将军: ${pCounts.general ? '存活' : '阵亡'}<br>
      <br>敌方剩余:<br>
      盾兵: ${eCounts.shield} | 长矛兵: ${eCounts.spear} | 骑兵: ${eCounts.cavalry}<br>
      射手: ${eCounts.archer} | 火枪手: ${eCounts.musketeer || 0} | 炮兵: ${eCounts.artillery || 0}<br>
      马克沁: ${eCounts.maxim || 0} | 将军: ${eCounts.general ? '存活' : '阵亡'}
    `;
    this.updateUI();
  }

  render() {
    const ctx = this.ctx;
    const w = this.canvasWidth, h = this.canvasHeight;

    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, w, h);

    // Grid lines
    ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.lineWidth = 1;
    for (let x = 0; x < w; x += 80) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
    for (let y = 0; y < h; y += 80) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }

    // Midline
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2;
    ctx.setLineDash([8, 12]);
    ctx.beginPath(); ctx.moveTo(this.midline, 0); ctx.lineTo(this.midline, h); ctx.stroke();
    ctx.setLineDash([]);

    // Team zone labels
    ctx.fillStyle = 'rgba(50,80,180,0.06)'; ctx.fillRect(0, 0, this.midline, h);
    ctx.fillStyle = 'rgba(180,50,50,0.06)'; ctx.fillRect(this.midline, 0, w - this.midline, h);

    // Draw terrain zones
    for (const zone of this.terrainZones) {
      switch (zone.type) {
        case 'river':
          ctx.fillStyle = 'rgba(30,80,180,0.15)';
          ctx.fillRect(zone.x1, zone.y1, zone.x2 - zone.x1, zone.y2 - zone.y1);
          ctx.strokeStyle = 'rgba(60,120,220,0.3)'; ctx.lineWidth = 2;
          ctx.setLineDash([4, 8]);
          ctx.strokeRect(zone.x1, zone.y1, zone.x2 - zone.x1, zone.y2 - zone.y1);
          ctx.setLineDash([]);
          ctx.fillStyle = 'rgba(100,160,240,0.1)';
          ctx.font = '18px sans-serif'; ctx.textAlign = 'center';
          ctx.fillText('～ 河流 ～', (zone.x1 + zone.x2) / 2, (zone.y1 + zone.y2) / 2);
          break;
        case 'rough':
          ctx.fillStyle = 'rgba(100,80,50,0.2)';
          ctx.fillRect(zone.x1, zone.y1, zone.x2 - zone.x1, zone.y2 - zone.y1);
          ctx.fillStyle = 'rgba(140,120,80,0.15)';
          for (let i = 0; i < 20; i++) {
            const rx = zone.x1 + Math.random() * (zone.x2 - zone.x1);
            const ry = zone.y1 + Math.random() * (zone.y2 - zone.y1);
            ctx.beginPath(); ctx.arc(rx, ry, 3 + Math.random() * 5, 0, Math.PI * 2); ctx.fill();
          }
          break;
        case 'highground':
          const grad = ctx.createLinearGradient(zone.x1, 0, zone.x2, 0);
          grad.addColorStop(0, 'rgba(100,140,80,0.18)');
          grad.addColorStop(1, 'rgba(100,140,80,0.05)');
          ctx.fillStyle = grad;
          ctx.fillRect(zone.x1, zone.y1, zone.x2 - zone.x1, zone.y2 - zone.y1);
          ctx.fillStyle = 'rgba(255,255,255,0.06)';
          ctx.font = '16px sans-serif'; ctx.textAlign = 'center';
          ctx.fillText('▲ 高地 ▲', (zone.x1 + zone.x2) / 2, zone.y1 + 30);
          break;
        case 'fort':
          ctx.strokeStyle = 'rgba(150,150,180,0.4)'; ctx.lineWidth = 3;
          ctx.strokeRect(zone.x1, zone.y1, zone.x2 - zone.x1, zone.y2 - zone.y1);
          ctx.fillStyle = 'rgba(100,120,160,0.08)';
          ctx.fillRect(zone.x1, zone.y1, zone.x2 - zone.x1, zone.y2 - zone.y1);
          ctx.fillStyle = 'rgba(255,255,255,0.08)';
          ctx.font = '16px sans-serif'; ctx.textAlign = 'center';
          ctx.fillText('█ 要塞 █', (zone.x1 + zone.x2) / 2, zone.y1 + 30);
          break;
      }
    }

    ctx.fillStyle = 'rgba(100,140,220,0.12)';
    ctx.font = '22px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('我方阵地', this.midline / 2, h / 2);
    ctx.fillStyle = 'rgba(220,120,100,0.12)';
    ctx.fillText('敌方阵地', this.midline + (w - this.midline) / 2, h / 2);

    // Draw units
    for (const u of this.playerUnits) if (u.alive) u.draw(ctx);
    for (const u of this.enemyUnits) if (u.alive) u.draw(ctx);

    // Draw projectiles
    for (const p of this.projectiles) p.draw(ctx);

    // Drag preview
    if (this.isDragging && this.state === 'deploy' && this.selectedType !== 'general') {
      const cfg = UNIT_CONFIG[this.selectedType];
      ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2;
      ctx.setLineDash([4, 6]);
      ctx.beginPath(); ctx.moveTo(this.dragStartX, this.dragStartY); ctx.lineTo(this.dragEndX, this.dragEndY); ctx.stroke();
      ctx.setLineDash([]);

      const spacing = cfg.radius * 2.8;
      const ldx = this.dragEndX - this.dragStartX, ldy = this.dragEndY - this.dragStartY;
      const lineLen = Math.sqrt(ldx * ldx + ldy * ldy);
      const maxFit = Math.floor(lineLen / spacing) + 1;
      const remaining = this.getMaxForType(this.selectedType) - this.getDeployedForType(this.selectedType);
      const count = Math.min(maxFit, remaining);

      for (let i = 0; i < count; i++) {
        const t = count === 1 ? 0.5 : i / (count - 1);
        const px = this.dragStartX + ldx * t, py = this.dragStartY + ldy * t;
        if (px < this.midline - 5 && px > 5 && py > 5 && py < h - 5) {
          ctx.globalAlpha = 0.5; ctx.fillStyle = cfg.color;
          if (cfg.shape === 'maxim' || cfg.shape === 'artillery') {
            ctx.fillRect(px - cfg.radius, py - cfg.radius * 0.35, cfg.radius * 2, cfg.radius * 0.7);
          } else if (cfg.shape === 'musketeer') {
            ctx.fillRect(px - cfg.radius * 0.5, py - cfg.radius * 0.6, cfg.radius, cfg.radius * 1.2);
          } else {
            ctx.beginPath(); ctx.arc(px, py, cfg.radius, 0, Math.PI * 2); ctx.fill();
          }
          ctx.globalAlpha = 1;
        }
      }
    }

    // Mouse ghost
    if (!this.isDragging && this.mouseOnCanvas && this.state === 'deploy' &&
        this.mouseX < this.midline - 5 && this.selectedType !== 'general') {
      const cfg = UNIT_CONFIG[this.selectedType];
      ctx.globalAlpha = 0.4; ctx.fillStyle = cfg.color;
      if (cfg.shape === 'maxim' || cfg.shape === 'artillery') {
        ctx.fillRect(this.mouseX - cfg.radius, this.mouseY - cfg.radius * 0.35, cfg.radius * 2, cfg.radius * 0.7);
      } else if (cfg.shape === 'musketeer') {
        ctx.fillRect(this.mouseX - cfg.radius * 0.5, this.mouseY - cfg.radius * 0.6, cfg.radius, cfg.radius * 1.2);
      } else {
        ctx.beginPath(); ctx.arc(this.mouseX, this.mouseY, cfg.radius, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // Countdown overlay
    if (this.state === 'countdown') {
      const sec = Math.ceil(this.countdownRemaining);
      ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#ffcc00'; ctx.font = 'bold 80px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(sec > 0 ? sec : '开始！', w / 2, h / 2 + 20);
    }
  }

  updateUI() {
    const pAlive = this.countAlive(this.playerUnits);
    const eAlive = this.countAlive(this.enemyUnits);

    document.getElementById('player-count').textContent = pAlive;
    document.getElementById('enemy-count').textContent = eAlive;

    const mission = MISSIONS[this.selectedMissionIdx];
    const diff = DIFFICULTY_LEVELS[this.selectedDifficulty];
    document.getElementById('mission-name').textContent = mission.name;
    const diffBadge = document.getElementById('difficulty-badge');
    diffBadge.textContent = diff.emoji + ' ' + diff.name;
    diffBadge.style.background = ['#2d4a1f', '#7a5a00', '#6b2121'][this.selectedDifficulty];
    diffBadge.style.color = ['#95d5b2', '#ffcc44', '#f88'][this.selectedDifficulty];

    // Per-type button text
    const buttonTypes = [
      ['btn-shield', 'shield'], ['btn-spear', 'spear'], ['btn-cavalry', 'cavalry'],
      ['btn-archer', 'archer'], ['btn-maxim', 'maxim'], ['btn-musketeer', 'musketeer'],
      ['btn-artillery', 'artillery']
    ];
    buttonTypes.forEach(([btnId, type]) => {
      const btn = document.getElementById(btnId);
      const cfg = UNIT_CONFIG[type];
      const deployed = this.getDeployedForType(type);
      const max = this.getMaxForType(type);
      const countSpan = btn.querySelector('.unit-count');
      if (countSpan) {
        countSpan.textContent = `${deployed}/${max}`;
        countSpan.style.color = deployed >= max ? '#f88' : '#888';
      }
      btn.classList.toggle('active', btn.dataset.type === this.selectedType);
      btn.classList.toggle('limited', deployed >= max);
      btn.disabled = this.state !== 'deploy';
    });

    const statusEl = document.getElementById('status-text');
    statusEl.className = 'status ' + this.state;
    const statusMap = { deploy: '部署阶段', countdown: '倒计时', battle: '战斗中', win: '胜利！', lose: '失败！', select: '选择关卡' };
    statusEl.textContent = statusMap[this.state] || '';

    if (this.state === 'countdown') {
      document.getElementById('countdown-text').textContent = Math.ceil(this.countdownRemaining) + 's';
    } else {
      document.getElementById('countdown-text').textContent = '--';
    }

    const skillStatus = document.getElementById('skill-status-text');
    const btnSkill = document.getElementById('btn-skill');
    if (this.skillActive) {
      skillStatus.textContent = `生效中 ${(this.skillTimer / 1000).toFixed(1)}s`;
      btnSkill.disabled = true;
      btnSkill.textContent = `📯 生效中 ${(this.skillTimer / 1000).toFixed(1)}s`;
    } else if (this.skillCooldownRemaining > 0) {
      skillStatus.textContent = `冷却 ${(this.skillCooldownRemaining / 1000).toFixed(1)}s`;
      btnSkill.disabled = true;
      btnSkill.textContent = `📯 冷却 ${(this.skillCooldownRemaining / 1000).toFixed(1)}s`;
    } else {
      skillStatus.textContent = '就绪';
      btnSkill.disabled = this.state !== 'battle' || !this.isPlayerGeneralAlive();
      btnSkill.textContent = '📯 战鼓激励';
    }

    document.getElementById('btn-start').disabled = this.state !== 'deploy';

    this.updateStatsPanel();
  }

  updateStatsPanel() {
    const panel = document.getElementById('stats-panel');
    if (this.state !== 'battle' && this.state !== 'win' && this.state !== 'lose') {
      if (panel.style.display === 'block' && this.state === 'deploy') panel.style.display = 'none';
      return;
    }
    panel.style.display = 'block';

    const pCounts = this.countAliveByType(this.playerUnits);
    const eCounts = this.countAliveByType(this.enemyUnits);

    panel.innerHTML = `
      <h3>📊 战斗统计</h3>
      <div style="color:#8f8;margin-bottom:4px;">━ 我方 ━</div>
      <div class="stat-row"><span>击杀</span><span class="my-kills">${this.playerKills}</span></div>
      <div class="stat-row"><span>🛡 盾兵</span><span>${pCounts.shield}/${UNIT_CONFIG.shield.maxCount}</span></div>
      <div class="stat-row"><span>🔱 长矛兵</span><span>${pCounts.spear}/${UNIT_CONFIG.spear.maxCount}</span></div>
      <div class="stat-row"><span>⚔ 骑兵</span><span>${pCounts.cavalry}/${UNIT_CONFIG.cavalry.maxCount}</span></div>
      <div class="stat-row"><span>🏹 射手</span><span>${pCounts.archer}/${UNIT_CONFIG.archer.maxCount}</span></div>
      <div class="stat-row"><span>🔫 马克沁</span><span>${pCounts.maxim || 0}/${UNIT_CONFIG.maxim.maxCount}</span></div>
      <div class="stat-row"><span>🎯 火枪手</span><span>${pCounts.musketeer || 0}/${UNIT_CONFIG.musketeer.maxCount}</span></div>
      <div class="stat-row"><span>💣 炮兵</span><span>${pCounts.artillery || 0}/${UNIT_CONFIG.artillery.maxCount}</span></div>
      <div class="stat-row"><span>⭐ 将军</span><span>${pCounts.general ? '存活' : '<span style="color:#f44">阵亡</span>'}</span></div>
      <div style="color:#f88;margin:6px 0 4px;">━ 敌方 ━</div>
      <div class="stat-row"><span>击杀</span><span class="kills">${this.enemyKills}</span></div>
      <div class="stat-row"><span>🛡 盾兵</span><span>${eCounts.shield}</span></div>
      <div class="stat-row"><span>🔱 长矛兵</span><span>${eCounts.spear}</span></div>
      <div class="stat-row"><span>⚔ 骑兵</span><span>${eCounts.cavalry}</span></div>
      <div class="stat-row"><span>🏹 射手</span><span>${eCounts.archer}</span></div>
      <div class="stat-row"><span>🔫 马克沁</span><span>${eCounts.maxim || 0}</span></div>
      <div class="stat-row"><span>🎯 火枪手</span><span>${eCounts.musketeer || 0}</span></div>
      <div class="stat-row"><span>💣 炮兵</span><span>${eCounts.artillery || 0}</span></div>
      <div class="stat-row"><span>⭐ 将军</span><span>${eCounts.general ? '存活' : '<span style="color:#f44">阵亡</span>'}</span></div>
    `;
  }

  setupMissionSelectUI() {
    const grid = document.getElementById('mission-grid');
    grid.innerHTML = '';
    MISSIONS.forEach((m, i) => {
      const card = document.createElement('div');
      card.className = 'mission-card' + (i === this.selectedMissionIdx ? ' selected' : '');
      card.innerHTML = `
        <div class="m-icon">${m.icon}</div>
        <div class="m-name">${m.name}</div>
        <div class="m-desc">${m.desc}</div>
      `;
      card.addEventListener('click', () => {
        this.selectedMissionIdx = i;
        this.setupMissionSelectUI();
      });
      grid.appendChild(card);
    });

    // Difficulty buttons
    document.querySelectorAll('#mission-select .diff-btn').forEach(btn => {
      const d = parseInt(btn.dataset.diff);
      btn.classList.toggle('selected', d === this.selectedDifficulty);
      btn.onclick = () => {
        this.selectedDifficulty = d;
        this.setupMissionSelectUI();
      };
    });

    document.getElementById('btn-go').onclick = () => this.init();
  }

  setupEvents() {
    // Unit selection
    ['btn-shield', 'btn-spear', 'btn-cavalry', 'btn-archer', 'btn-maxim', 'btn-musketeer', 'btn-artillery'].forEach(id => {
      document.getElementById(id).addEventListener('click', (e) => {
        if (this.state !== 'deploy') return;
        this.selectedType = e.currentTarget.dataset.type;
        this.updateUI();
      });
    });

    document.getElementById('btn-start').addEventListener('click', () => this.startBattle());
    document.getElementById('btn-reset').addEventListener('click', () => this.reset());
    document.getElementById('btn-choose-mission').addEventListener('click', () => this.showMissionSelect());
    document.getElementById('btn-skill').addEventListener('click', () => this.activateSkill());

    // Result overlay buttons
    document.getElementById('btn-retry').addEventListener('click', () => this.reset());
    document.getElementById('btn-back').addEventListener('click', () => this.showMissionSelect());

    // Canvas mouse events
    this.canvas.addEventListener('mousedown', (e) => this.onMouseDown(e));
    this.canvas.addEventListener('mousemove', (e) => this.onMouseMove(e));
    this.canvas.addEventListener('mouseup', (e) => this.onMouseUp(e));
    this.canvas.addEventListener('mouseleave', (e) => this.onMouseLeave(e));

    // Touch events
    this.canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const t = e.touches[0];
      this.onMouseDown({ clientX: t.clientX, clientY: t.clientY });
    });
    this.canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const t = e.touches[0];
      this.onMouseMove({ clientX: t.clientX, clientY: t.clientY });
    });
    this.canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      this.onMouseUp(e);
    });

    window.addEventListener('resize', () => this.resize());

    // Keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      if (this.state === 'select') return;
      if (this.state !== 'deploy') {
        if (e.key === 'r' || e.key === 'R') { this.reset(); return; }
        return;
      }
      switch (e.key) {
        case '1': this.selectedType = 'shield'; break;
        case '2': this.selectedType = 'spear'; break;
        case '3': this.selectedType = 'cavalry'; break;
        case '4': this.selectedType = 'archer'; break;
        case '5': this.selectedType = 'maxim'; break;
        case '6': this.selectedType = 'musketeer'; break;
        case '7': this.selectedType = 'artillery'; break;
        case 'Enter': this.startBattle(); break;
        case 'r': case 'R': this.reset(); break;
        default: return;
      }
      this.updateUI();
    });
  }

  getCanvasPos(e) {
    const rect = this.canvas.getBoundingClientRect();
    const scaleX = this.canvasWidth / rect.width;
    const scaleY = this.canvasHeight / rect.height;
    return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
  }

  onMouseDown(e) {
    if (this.state !== 'deploy') return;
    const pos = this.getCanvasPos(e);
    if (pos.x >= this.midline - 5 || this.selectedType === 'general') return;
    const max = this.getMaxForType(this.selectedType);
    if (this.getDeployedForType(this.selectedType) >= max) return;
    this.isDragging = true;
    this.dragStartX = pos.x; this.dragStartY = pos.y;
    this.dragEndX = pos.x; this.dragEndY = pos.y;
  }

  onMouseMove(e) {
    const pos = this.getCanvasPos(e);
    this.mouseX = pos.x; this.mouseY = pos.y;
    this.mouseOnCanvas = true;
    if (this.isDragging) {
      this.dragEndX = Math.min(pos.x, this.midline - 8);
      this.dragEndY = Math.max(8, Math.min(pos.y, this.canvasHeight - 8));
    }
  }

  onMouseUp(e) {
    if (!this.isDragging) return;
    this.isDragging = false;
    const dx = this.dragEndX - this.dragStartX;
    const dy = this.dragEndY - this.dragStartY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 3) {
      this.deployPlayerUnit(this.dragStartX, this.dragStartY);
    } else {
      this.deployLine(this.dragStartX, this.dragStartY, this.dragEndX, this.dragEndY);
    }
  }

  onMouseLeave(e) {
    this.mouseOnCanvas = false;
    if (this.isDragging) this.onMouseUp(e);
  }

  loop() {
    const now = performance.now();
    const dt = now - this.lastTime;
    this.lastTime = now;

    this.update(dt);
    this.render();

    if (this.state === 'countdown') this.updateUI();

    requestAnimationFrame(() => this.loop());
  }
}

// ============================================================
// INIT
// ============================================================
window.addEventListener('DOMContentLoaded', () => {
  const canvas = document.getElementById('gameCanvas');
  new Game(canvas);
});
</script>
